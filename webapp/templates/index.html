<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <h1>Web App Vulnerability Scanner</h1>
      <form action="/scan" method="post">
        <label>Target URL</label>
        <input name="target" placeholder="http://example.local" required>
        <button type="submit">Start Scan</button>
      </form>
      <p>Use only on targets you own or have permission to test.</p>
    </div>
  </body>
</html>
